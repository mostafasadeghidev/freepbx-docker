<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">FreePBX 17 on Docker</title>
  <desc id="desc">The official Sangoma installer for FreePBX 17 and Asterisk 22, running in a Docker container and set up with one command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="0.55" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#0B4F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.81" cy="0.5" r="0.32">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="98" fill="#5EEAD4" font-size="15" font-weight="600" letter-spacing="4">FREEPBX · ASTERISK · DOCKER</text>
    <text x="78" y="162" fill="#FFFFFF" font-size="60" font-weight="700">FreePBX 17 on Docker</text>
    <text x="80" y="206" fill="#A9BCD0" font-size="22">The official Sangoma installer, in a container — one command.</text>

    <g font-size="15" fill="#E2E8F0" text-anchor="middle">
      <rect x="80" y="236" width="124" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <text x="142" y="257">Asterisk 22</text>
      <rect x="216" y="236" width="108" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <text x="270" y="257">Debian 12</text>
      <rect x="336" y="236" width="172" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <text x="422" y="257">Bridge networking</text>
      <rect x="520" y="236" width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#5EEAD4" stroke-opacity="0.35"/>
      <text x="590" y="257">Coolify-ready</text>
    </g>
  </g>

  <!-- A container with a handset inside it: the PBX, boxed. -->
  <g transform="translate(1030 160)">
    <rect x="-116" y="-104" width="260" height="180" rx="18" fill="none" stroke="#5EEAD4" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="-130" y="-90" width="260" height="180" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#5EEAD4" stroke-opacity="0.65" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="6" stroke-linecap="round">
      <line x1="-100" y1="-68" x2="-100" y2="68"/>
      <line x1="-76" y1="-68" x2="-76" y2="68"/>
      <line x1="76" y1="-68" x2="76" y2="68"/>
      <line x1="100" y1="-68" x2="100" y2="68"/>
    </g>

    <g transform="rotate(-45)">
      <path d="M 0 -40 Q -24 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
      <rect x="-8" y="-62" width="34" height="28" rx="12" fill="#FFFFFF"/>
      <rect x="-8" y="34" width="34" height="28" rx="12" fill="#FFFFFF"/>
    </g>

    <g fill="none" stroke="#5EEAD4" stroke-linecap="round">
      <path d="M 38 -52 A 64 64 0 0 1 58 -28" stroke-width="5" stroke-opacity="0.9"/>
      <path d="M 48 -70 A 86 86 0 0 1 76 -36" stroke-width="5" stroke-opacity="0.55"/>
    </g>
  </g>
</svg>
