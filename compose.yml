# ---------------------------------------------------------------------------
# FreePBX 17 (Asterisk 22, PHP 8.2) — Debian 12 + systemd + the official
# Sangoma installer.
#
# Sized for ~20 extensions and a handful of calls a day, on a server that is
# already busy. That size is the whole reason this file looks different from
# the usual FreePBX-in-Docker recipe:
#
#   Bridge networking, not `network_mode: host`.
#
# Host networking is in those recipes because the default RTP range is
# 10000-20000 — ten thousand UDP ports, which Docker will not publish at any
# sensible speed. Twenty extensions do not need ten thousand ports. Forty is
# plenty (two per call, twenty calls at once), and forty publish fine. In
# exchange the container keeps its own network namespace, so it cannot collide
# with anything already on the host — a proxy already there (Caddy, Traefik,
# nginx, Coolify's) keeps ports 80 and 443 and nothing has to move.
#
# The one thing that MUST be right: Asterisk has to know it is behind NAT.
# See the README — External Address and Local Networks in Asterisk SIP
# Settings. Get that wrong and calls connect with silence on one side.
#
# The host-networking version of this file is kept beside it as
# compose.host-networking.yml, for a machine where nothing else uses 80/443
# and a full RTP range is wanted.
# ---------------------------------------------------------------------------
services:
  freepbx:
    # ⚠️ AFTER THE FIRST INSTALL THE IMAGE HAS TO BE THE SNAPSHOT.
    #
    # The volumes below keep the *data*. They do not keep the *software*: the
    # installer writes mariadb, apache, php, asterisk and their systemd units
    # into the container's own filesystem, and `docker compose up` recreating
    # the container throws all of that away. What is left is an empty Debian
    # that reads the "already installed" marker in ./data and starts services
    # that no longer exist:
    #
    #     Failed to start mariadb.service: Unit mariadb.service not found.
    #
    # Measured, on a real install, from pressing update in a UI. And recovery
    # is not just "install again": the package sees a populated /var/www/html,
    # decides FreePBX is already there, and never creates fwconsole. Getting
    # back means wiping ./data and installing clean — so take the snapshot.
    #
    # `./snapshot.sh` commits the installed container to
    # `freepbx17-official:installed`, and one line in .env points the kit at it:
    #
    #     PBX_IMAGE=freepbx17-official:installed
    #
    # setup.sh does both. This file is not edited, and the `build:` block below
    # stays: compose builds only when the image PBX_IMAGE names does not exist.
    #
    # After an install that is exactly the dangerous case, so two commands are
    # never run here once FreePBX is installed:
    #
    #     docker compose build            docker compose up -d --build
    #
    # Both build a fresh, EMPTY image and give it the snapshot's name, and the
    # next recreate erases the install (measured — see scripts/recreate.sh).
    # The same happens if an image clean-up deletes the snapshot while the
    # container still runs the build image, and a plain `up -d` follows —
    # Coolify's periodic clean-up did exactly that on the test server.
    # `./apply.sh` looks at the image a recreate would use and refuses both;
    # `./doctor.sh` reports them.
    build:
      context: .
    image: ${PBX_IMAGE:-freepbx17-official:local}
    container_name: freepbx
    restart: unless-stopped

    # systemd as PID 1 needs cgroup write access, and the FreePBX firewall
    # module wants iptables. This is the price of running the official
    # installer, which calls systemctl and cannot run without a real init.
    privileged: true
    stop_signal: SIGRTMIN+3
    stop_grace_period: 1m

    # DNS. Read the volume mount below before changing any of this.
    #
    # `dns:` alone does NOT do what it looks like it does. Docker still writes
    # `nameserver 127.0.0.11` into the container's resolv.conf and treats this
    # list only as that embedded resolver's upstreams -- the container stays
    # dependent on the resolver, and on the NAT rule that makes it reachable.
    # Kept because it is still the right upstream list if the mount is removed.
    dns:
      - 1.1.1.1
      - 9.9.9.9
      - 8.8.8.8

    # Two questions, because both were answered "yes" while the phones were
    # dead, and neither was being asked:
    #
    #   Can it resolve a name?  The FreePBX firewall module wipes Docker's DNS
    #   rule, and a PBX that cannot resolve its trunk's hostname registers
    #   nothing -- while a probe by IP from the same container answers 200 OK.
    #   That contradiction cost an hour before anybody thought to check DNS.
    #
    #   Is Asterisk actually up?  systemd reports the unit started long before
    #   Asterisk is answering.
    #
    # Any resolvable name does the job; this one is used because a PBX that
    # cannot reach it cannot fetch module updates either.
    #
    # start_period covers the first install, which downloads several GB and
    # takes 20-40 minutes. During it the container is "starting", not
    # "unhealthy" -- a failing healthcheck on a fresh install would be noise.
    healthcheck:
      test: ["CMD-SHELL", "getent hosts mirror.freepbx.org >/dev/null 2>&1 && asterisk -rx 'core show version' >/dev/null 2>&1"]
      interval: 5m
      timeout: 20s
      start_period: 45m
      retries: 3

    tmpfs:
      - /run
      - /run/lock

    # Both, and neither is required: `.env` answers compose's questions and
    # `pbx.env` the installer's. An installation that predates the split has
    # only the second, and still works.
    env_file:
      - path: ./.env
        required: false
      - path: ./pbx.env
        required: false

    ports:
      # --- SIP signalling -------------------------------------------------
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_PORT:-5060}:5060/tcp"
      # TLS. Uncomment once certificates are set up in FreePBX.
      # - "5061:5061/tcp"

      # --- RTP (the audio) ------------------------------------------------
      # Must match the RTP range configured in FreePBX (Settings → Asterisk
      # SIP Settings → RTP Port Ranges). Forty ports is about twenty calls at
      # once. Widen both together if that is ever not enough.
      - "${RTP_START:-10000}-${RTP_END:-10039}:${RTP_START:-10000}-${RTP_END:-10039}/udp"

      # --- The web panel --------------------------------------------------
      # Bound to localhost, so it is NOT on the internet. A proxy on this host
      # (Caddy, nginx) or Coolify's, through compose.coolify.yml, puts it on a
      # domain with HTTPS — see the README.
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8088}:80"

    volumes:
      # The DNS fix that actually works, and the reasoning is worth keeping
      # because the obvious fix does not.
      #
      # Docker's embedded resolver at 127.0.0.11 does not answer in this
      # container. Measured, from inside it: a DNS query to 127.0.0.11 times
      # out; the same query to 1.1.1.1 answers in milliseconds. So the fault is
      # the embedded resolver, not the network -- and `dns:` cannot help,
      # because Docker keeps pointing resolv.conf at that same resolver.
      #
      # The FreePBX firewall module made this worse by wiping the NAT rule the
      # resolver needs, but disabling the module did not fix it: the rules came
      # back on recreate and the resolver still timed out. Replacing the file
      # outright is what worked.
      #
      # What this costs: the container can no longer resolve other containers
      # by name. Nothing here needs to -- mariadb, apache and asterisk are all
      # inside this one. A proxy in front resolves THIS container from its own
      # side, which is unaffected.
      - ./resolv.conf:/etc/resolv.conf:ro
      # installer options, read by the freepbx-bootstrap systemd unit
      - ./pbx.env:/etc/freepbx-container.env:ro
      # marker file + copies of /etc config that no other volume covers
      - ./data/persist:/data
      - ./data/mysql:/var/lib/mysql
      - ./data/etc-asterisk:/etc/asterisk
      - ./data/lib-asterisk:/var/lib/asterisk
      - ./data/spool-asterisk:/var/spool/asterisk
      - ./data/log-asterisk:/var/log/asterisk
      - ./data/log-pbx:/var/log/pbx
      - ./data/www:/var/www/html
      - ./data/home-asterisk:/home/asterisk

  # -------------------------------------------------------------------------
  # The tunnel that DIALS OUT. Off unless COMPOSE_PROFILES=tunnel in .env.
  #
  # A tunnel exists for one situation: the PBX is on a server outside the
  # country and the telephone provider will only exchange calls with an
  # address inside it. The tunnel gives this container a second address on
  # that side, and the provider talks to that.
  #
  # This service is the rarer of its two directions: this server dials a far
  # end that has a public address and handed you an .ovpn file. The usual far
  # end is a router on an office line or a SIM, behind its provider's NAT, which
  # nothing can dial — then this server LISTENS and the router dials in, and
  # that is compose.tunnel-server.yml, set up by `./tunnel/listen.sh` (or by
  # answering `listen` in setup.sh). Measured on a real router: both its lines
  # were in 100.64.0.0/10, carrier NAT. See tunnel/README.md.
  #
  # Most installations need neither. A PBX on a server in the same country as
  # its provider should leave both off and never think about them again.
  #
  # `network_mode: service:freepbx` puts the tunnel INSIDE the PBX's network
  # namespace rather than beside it — the two share one set of interfaces, so
  # Asterisk sees the tunnel address as its own without any routing rules on
  # the host. The price is that the tunnel cannot start on its own: it lives
  # and dies with the PBX container.
  #
  # Put your provider's .ovpn file at tunnel/client.ovpn — see tunnel/README.md.
  # -------------------------------------------------------------------------
  tunnel:
    image: ${TUNNEL_IMAGE:-alpine:3.20}
    container_name: freepbx-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - freepbx
    network_mode: service:freepbx
    # NET_ADMIN to create the interface, /dev/net/tun to be a tunnel at all.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tunnel:/etc/tunnel:ro
    command: >
      sh -c "apk add --no-cache openvpn >/dev/null &&
             exec openvpn --config /etc/tunnel/client.ovpn
                          --auth-nocache --verb 3"
