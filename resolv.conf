# Mounted read-only over the container's /etc/resolv.conf by compose.yml.
#
# Docker's embedded resolver at 127.0.0.11 does not answer in this container.
# Measured: a direct DNS query to 127.0.0.11 times out, while the same query
# to 1.1.1.1 from the same container answers in milliseconds. Naming real
# resolvers here skips the embedded one entirely.
#
# Change these to whatever your host should use.
nameserver 185.12.64.1
nameserver 185.12.64.2
nameserver 1.1.1.1
options timeout:2 attempts:2
